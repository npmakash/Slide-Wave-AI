<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="swGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="slideGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#swGradient)" filter="url(#shadow)" />

  <!-- Presentation Slide Representation -->
  <g transform="translate(96, 112)">
    <!-- Slide Base Plate -->
    <rect x="0" y="0" width="320" height="220" rx="24" fill="url(#slideGrad)" />
    
    <!-- Header Line -->
    <rect x="32" y="36" width="140" height="18" rx="9" fill="#6366f1" />
    <rect x="186" y="36" width="102" height="18" rx="9" fill="#8b5cf6" opacity="0.6" />

    <!-- Content Blocks / Chart Pillars -->
    <rect x="32" y="80" width="76" height="104" rx="12" fill="#6366f1" opacity="0.15" />
    <rect x="122" y="80" width="76" height="104" rx="12" fill="#8b5cf6" opacity="0.25" />
    <rect x="212" y="80" width="76" height="104" rx="12" fill="#ec4899" opacity="0.2" />

    <!-- Wave Sparkle Overlay -->
    <path d="M 32 150 Q 110 110, 160 145 T 288 130" fill="none" stroke="#6366f1" stroke-width="10" stroke-linecap="round" />
  </g>

  <!-- Presentation Stand Feet -->
  <path d="M 192 368 L 160 432 M 320 368 L 352 432" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
  <rect x="236" y="352" width="40" height="32" rx="8" fill="#ffffff" />
</svg>